name: Feature request
description: Suggest an improvement or a missing feature
labels: ["enhancement"]
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case, not only the solution
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
      description: For example the Resend, Postmark or SES feature you rely on
