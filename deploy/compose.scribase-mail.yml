# Scribase Mail: web + Postgres + Redis on one host.
#
# Memory budget (hard limits): web 896 MB + postgres 448 MB + redis 128 MB = 1472 MB.
# Data lives in local bind mounts under ${SCRIBASE_MAIL_DATA_DIR:-./data}.
# The web app binds 127.0.0.1 only; the host's Caddy terminates TLS.
#
# Usage (from the repository root on the server):
#   docker compose -f deploy/compose.scribase-mail.yml --env-file deploy/.env build
#   docker compose -f deploy/compose.scribase-mail.yml --env-file deploy/.env up -d

name: scribase-mail

services:
  postgres:
    image: postgres:16-alpine
    container_name: scribase-mail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=40
    volumes:
      - ${SCRIBASE_MAIL_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 448m
    networks: [internal]

  redis:
    image: redis:7-alpine
    container_name: scribase-mail-redis
    restart: unless-stopped
    # BullMQ requires noeviction; AOF keeps queued jobs across restarts.
    command:
      [
        "redis-server",
        "--maxmemory",
        "96mb",
        "--maxmemory-policy",
        "noeviction",
        "--appendonly",
        "yes",
      ]
    volumes:
      - ${SCRIBASE_MAIL_DATA_DIR:-./data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-scribase-mail}
        GIT_SHA: ${GIT_SHA:-unknown}
        IS_CLOUD: ${IS_CLOUD:-true}
    image: scribase-mail:${GIT_SHA:-latest}
    container_name: scribase-mail-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SCRIBASE_MAIL_PORT:-4350}:3000"
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NODE_OPTIONS: --max-old-space-size=640
      # Multi-tenant mode: sign-ups without an invite wait for admin approval,
      # new teams warm up, and the reputation guard pauses bad senders.
      NEXT_PUBLIC_IS_CLOUD: ${IS_CLOUD:-true}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET}
      FROM_EMAIL: ${FROM_EMAIL:?set FROM_EMAIL}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL (approves the waitlist)}
      GITHUB_ID: ${GITHUB_ID:-}
      GITHUB_SECRET: ${GITHUB_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Oracle Cloud Email Delivery
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?set SMTP_USER}
      SMTP_PASS: ${SMTP_PASS:?set SMTP_PASS}
      OCI_REGION: ${OCI_REGION:-eu-frankfurt-1}
      OCI_TENANCY: ${OCI_TENANCY:?set OCI_TENANCY}
      OCI_USER: ${OCI_USER:?set OCI_USER}
      OCI_FINGERPRINT: ${OCI_FINGERPRINT:?set OCI_FINGERPRINT}
      OCI_COMPARTMENT_ID: ${OCI_COMPARTMENT_ID:-}
      OCI_PRIVATE_KEY_PATH: /run/secrets/oci_api_key.pem
      SUPPRESSION_POLL_CRON: ${SUPPRESSION_POLL_CRON:-*/5 * * * *}
      # Content screening + review queue (see DEPLOY.md "Abuse controls")
      CONTENT_SCREENING_ENABLED: ${CONTENT_SCREENING_ENABLED:-true}
      # "-" (not ":-"): an explicitly empty value turns the feeds off
      SCREENING_FEED_URLS: ${SCREENING_FEED_URLS-https://raw.githubusercontent.com/Phishing-Database/Phishing.Database/master/phishing-domains-ACTIVE.txt}
      SCREENING_FEED_CRON: ${SCREENING_FEED_CRON:-17 */6 * * *}
      SCREENING_ALLOWLIST_DOMAINS: ${SCREENING_ALLOWLIST_DOMAINS:-}
      SCREENING_BLOCKED_DOMAINS: ${SCREENING_BLOCKED_DOMAINS:-}
      FIRST_SENDS_REVIEW_EMAILS: ${FIRST_SENDS_REVIEW_EMAILS:-}
      FIRST_SENDS_REVIEW_HOURS: ${FIRST_SENDS_REVIEW_HOURS:-}
      SMTP_PUBLIC_HOST: ${SMTP_PUBLIC_HOST:-smtp.mail.scribase.com}
      SMTP_PUBLIC_USER: ${SMTP_PUBLIC_USER:-scribase}
      OCI_STORAGE_NAMESPACE: ${OCI_STORAGE_NAMESPACE:-}
      OCI_STORAGE_BUCKET: ${OCI_STORAGE_BUCKET:-}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-2}
      AUTH_EMAIL_RATE_LIMIT: ${AUTH_EMAIL_RATE_LIMIT:-5}
      EMAIL_CLEANUP_DAYS: ${EMAIL_CLEANUP_DAYS:-30}
    volumes:
      - ${OCI_PRIVATE_KEY_FILE:?set OCI_PRIVATE_KEY_FILE}:/run/secrets/oci_api_key.pem:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 896m
    networks: [internal]

networks:
  internal:
    driver: bridge
