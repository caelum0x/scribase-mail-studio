packages:
  - "packages/*"
  - "apps/*"

allowBuilds:
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  esbuild: true
  keytar: true
  msgpackr-extract: true
  prisma: true
  puppeteer: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - oci-common@2.142.2
  - oci-email@2.142.2
  - oci-objectstorage@2.142.2
  - oci-logging@2.142.2
  - oci-loggingsearch@2.142.2

# pnpm 10+ reads overrides from the workspace configuration. Keep this in sync
# with package.json for deployment environments that still use pnpm 9.
overrides:
  "linkify-it@<=5.0.0": "5.0.1"
  "pnpm@<11.11.0": "11.11.0"
